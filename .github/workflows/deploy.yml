name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A marketing site that silently rots is worse than one that never shipped.
  # This catches an upstream dependency break before a visitor does.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The README is the repository's front page and carries the price table.
      # It cannot read from src/config.ts, so this is what keeps them honest.
      - name: README price table must match src/config.ts
        run: npm run sync:readme -- --check
      - run: npm run build
      - name: Fail if the SEO files are missing or empty
        run: |
          for f in dist/sitemap.xml dist/robots.txt dist/llms.txt; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
      # Three articles shipped 404s to non-existent service slugs. Nothing was
      # checking internal links at all.
      - name: No broken internal links
        run: node scripts/check-links.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
